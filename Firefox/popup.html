<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 12px;
      font-family: Tahoma, Segoe UI, sans-serif;
      background: #ece9d8;
      color: #111;
    }
    button {
      padding: 5px 10px;
      cursor: pointer;
      font-size: 12px;
      border-radius: 3px;
      border: 1px solid #003c74;
      background: #fff;
    }
    button.primary {
      width: 100%;
      padding: 8px;
      background: #0054e3;
      color: #fff;
      font-weight: bold;
      margin-bottom: 10px;
    }
    button.danger { background: #c9302c; color: #fff; border-color: #900; }
    .toggle-row {
      font-size: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    .list {
      max-height: 320px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #aaa;
      border-radius: 3px;
      padding: 6px;
    }
    .item {
      display: flex;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 6px 0;
    }
    .item:last-child { border-bottom: none; }
    .item img {
      width: 52px;
      height: 56px;
      object-fit: contain;
      background: #000;
      border: 1px solid #ccc;
    }
    .meta { flex: 1; font-size: 11px; overflow: hidden; }
    .meta b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btns { display: flex; flex-direction: column; gap: 4px; }
  </style>
</head>
<body>
  <button id="openStudioBtn" class="primary">Открыть студию (конвертер)</button>

  <label class="toggle-row">
    <input type="checkbox" id="enabledToggle">
    <span>Подменять видео-картинки на Стрекозе</span>
  </label>

  <div class="list" id="list">Загрузка...</div>

  <script src="db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
